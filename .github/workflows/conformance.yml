name: provider-conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      enable_real_probes:
        description: Run protected real-provider probes
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  fake-provider:
    strategy:
      fail-fast: false
      matrix:
        profile: [openai-chat, openai-responses, anthropic-messages, generic-alias]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Build and start non-production conformance stack
        run: |
          go build -o /tmp/aegis-fakeprovider ./cmd/fakeprovider
          go build -o /tmp/aegis-gateway ./cmd/gateway
          /tmp/aegis-fakeprovider --port 19090 --profile matrix >/tmp/fakeprovider.log 2>&1 &
          /tmp/aegis-gateway >/tmp/gateway.log 2>&1 &

          for endpoint in http://127.0.0.1:19090/health http://127.0.0.1:18080/health; do
            ready=false
            for _ in $(seq 1 60); do
              if curl --fail --silent --show-error "$endpoint" >/dev/null; then
                ready=true
                break
              fi
              sleep 1
            done
            if [ "$ready" != true ]; then
              echo "Conformance service did not become ready: $endpoint" >&2
              printf '%s\n' '--- fake provider log ---' >&2
              cat /tmp/fakeprovider.log >&2 || true
              printf '%s\n' '--- gateway log ---' >&2
              cat /tmp/gateway.log >&2 || true
              exit 1
            fi
          done
        env:
          LISTEN_ADDR: :18080
          UPSTREAM_BASE_URL: http://127.0.0.1:19090
          UPSTREAM_AUTH_MODE: none
          SECURITY_MODE: off
          AUTH_MODE: off
          AUDIT_WAL_DIR: /tmp/aegisllm-conformance-audit
          TOKEN_VAULT_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - name: Run required profile
        run: |
          mkdir -p artifacts
          go run ./cmd/conformancetool run --target http://127.0.0.1:18080 --profiles "${{ matrix.profile }}" --report artifacts/${{ matrix.profile }}.json --junit artifacts/${{ matrix.profile }}.xml
          go run ./cmd/conformancetool validate-report --report artifacts/${{ matrix.profile }}.json --junit artifacts/${{ matrix.profile }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-${{ matrix.profile }}
          path: artifacts/

  real-provider-probes:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_real_probes == true }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Real-provider probes are opt-in and must be added by a protected environment."
