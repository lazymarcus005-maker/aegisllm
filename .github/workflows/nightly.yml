name: nightly-release-assurance
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make fuzz-smoke
        env: {FUZZTIME: 10s}
      - run: scripts/release/race-docker.sh
      - run: scripts/release/e2e-docker.sh
      - run: scripts/release/static-pinned.sh
      - run: scripts/release/license-pinned.sh
        continue-on-error: true
      - run: scripts/release/image-scan.sh
        continue-on-error: true
