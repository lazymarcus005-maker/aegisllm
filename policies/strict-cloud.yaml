# Strict cloud deployment: fail closed for unknown findings, block credential
# classes, and tokenize ordinary PII before a cloud boundary. Use with
# SECURITY_MODE=enforce and AUTH_MODE=jwt in production.
id: strict-cloud
version: 8
owner: security-team
effective_date: "2026-10-07"

quarantine:
  enabled: true
  max_ttl: 30m
  probation_ttl: 10m
  max_states: 10000
  default: {reason: default, level: observe, scope: session, threshold: 3, window: 1m, cooldown: 1m, ttl: 10m}
  rules:
    - {reason: secret_exfiltration, level: isolate, scope: user, threshold: 3, window: 5m, cooldown: 1m, ttl: 15m}
    - {reason: detector_evasion, level: isolate, scope: session, threshold: 3, window: 5m, cooldown: 1m, ttl: 10m}
    - {reason: rag_cross_scope_access, level: require_human_review, scope: user, threshold: 2, window: 5m, cooldown: 1m, ttl: 15m}
    - {reason: tool_policy_violation, level: isolate, scope: application, threshold: 3, window: 5m, cooldown: 1m, ttl: 15m}
    - {reason: token_reidentification_abuse, level: isolate, scope: session, threshold: 2, window: 5m, cooldown: 1m, ttl: 15m}
    - {reason: auth_anomaly, level: require_human_review, scope: user, threshold: 3, window: 5m, cooldown: 1m, ttl: 15m}
    - {reason: provider_integrity_failure, level: disable, scope: provider, threshold: 3, window: 10m, cooldown: 5m, ttl: 15m, allow_broad: true}
    - {reason: operator_action, level: isolate, scope: session, threshold: 1, window: 1m, cooldown: 1s, ttl: 15m}

rag:
  mode: enforce
  on_deny: block
  require_purpose: true
  require_collection: true
  allowed_operations: [retrieve, retrieve_result]

default:
  action: allow
evasion:
  enabled: true
  transforms: [nfkc, controls, confusable_skeleton, base64, percent, json_unicode]
  max_decode_depth: 1
  max_decode_work_bytes: 262144
  max_decoded_expansion_ratio: 8
  max_json_depth: 8
  max_json_nodes: 512
  max_json_string_bytes: 16384
  budget_action: block
  actions: {encoded: block, cross_part: block, structured_json: block, zero_width_control: review, budget_exceeded: block}
safe_default:
  action: block

category_actions:
  SECRET: {action: redact}
  PII: {action: redact}

provider_overrides:
  cloud:
    categories:
      PII: {action: tokenize}
  local:
    categories:
      PII: {action: redact}

subtype_actions:
  SECRET:
    GITLAB_PAT: block
    GITHUB_TOKEN: block
    PEM_PRIVATE_KEY: block
    JWT: redact
    BEARER_TOKEN: redact
    AWS_ACCESS_KEY: redact
    AWS_SECRET_ACCESS_KEY: block
    OPENAI_API_KEY: block
    ANTHROPIC_API_KEY: redact
    SLACK_TOKEN: redact
    GOOGLE_API_KEY: redact
    GENERIC_API_KEY: redact
    CONNECTION_STRING: redact
    HIGH_ENTROPY_SECRET: redact
  PII:
    TH_CITIZEN_ID: redact
    PHONE_NUMBER: redact
    EMAIL: redact
    CREDIT_CARD: redact
    IP_ADDRESS: redact

confidence_escalation:
  - id: high-confidence-secret
    category: SECRET
    min_confidence: 0.90
    action: block
finding_count_escalation:
  - id: multiple-pii
    category: PII
    min_count: 3
    action: review

fallback:
  laya_unavailable:
    high_risk: block
    low_risk: deterministic_only
