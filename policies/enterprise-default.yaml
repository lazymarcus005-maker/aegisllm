# enterprise-default policy (spec §8; ticket-05 schema scope)
id: enterprise-default
version: 4
owner: security-team
effective_date: "2026-10-05"

default:
  action: allow

# Provider-boundary baseline for confidential data (precedence level 5).
targets:
  cloud:
    confidential_data: redact
  local:
    confidential_data: allow

secrets:
  GITLAB_PAT:
    action: block
  GITHUB_TOKEN:
    action: block
  PEM_PRIVATE_KEY:
    action: block
  JWT:
    action: block
  BEARER_TOKEN:
    action: block
  AWS_ACCESS_KEY:
    action: block
  CONNECTION_STRING:
    action: block

# PII transformation policy (precedence level 6; ticket 05 consumes).
pii:
  TH_CITIZEN_ID:
    providers:
      cloud:
        action: redact
      local:
        action: allow
  PHONE_NUMBER:
    providers:
      cloud:
        action: redact
  EMAIL:
    providers:
      cloud:
        action: redact
  CREDIT_CARD:
    providers:
      cloud:
        action: redact

# Semantic risk policy (precedence level 7; tickets 08-11 consume).
semantic:
  prompt_injection:
    high:
      action: block
    medium:
      action: restrict_tools
  system_prompt_extraction:
    high:
      action: block
  credential_exfiltration:
    high:
      action: block

fallback:
  laya_unavailable:
    high_risk: block
    low_risk: deterministic_only
