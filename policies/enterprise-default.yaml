# enterprise-default policy (spec §8; ticket-12 schema scope)
id: enterprise-default
version: 7
owner: security-team
effective_date: "2026-10-05"

default:
  action: allow

# Provider-boundary baseline for confidential data (precedence level 5).
targets:
  cloud:
    confidential_data: tokenize
  local:
    confidential_data: allow

# Secret protection (precedence level 2). redact = hard mask: the matched
# span is replaced with [REDACTED:SUBTYPE] and the request/response continues;
# the raw value never leaves the gateway and is never recoverable (no vault
# entry). Use action: block to reject the whole request/response instead.
secrets:
  GITLAB_PAT:
    action: redact
  GITHUB_TOKEN:
    action: redact
  PEM_PRIVATE_KEY:
    action: redact
  JWT:
    action: redact
  BEARER_TOKEN:
    action: redact
  AWS_ACCESS_KEY:
    action: redact
  CONNECTION_STRING:
    action: redact

# PII transformation policy (precedence level 6; ticket 05 consumes).
pii:
  TH_CITIZEN_ID:
    providers:
      cloud:
        action: tokenize
      local:
        action: allow
  PHONE_NUMBER:
    providers:
      cloud:
        action: tokenize
  EMAIL:
    providers:
      cloud:
        action: tokenize
  CREDIT_CARD:
    providers:
      cloud:
        action: tokenize

# Semantic risk policy (precedence level 7; tickets 08-11 consume).
semantic:
  prompt_injection:
    high:
      action: block
    medium:
      action: restrict_tools
  system_prompt_extraction:
    high:
      action: block
  credential_exfiltration:
    high:
      action: block
  unsafe_tool_intent:
    high:
      action: restrict_tools
  policy_bypass_intent:
    medium:
      action: restrict_tools

# Tool definitions RESTRICT_TOOLS strips from requests (T-025).
tools:
  restricted:
    - shell
    - file_write

fallback:
  laya_unavailable:
    high_risk: block
    low_risk: deterministic_only
