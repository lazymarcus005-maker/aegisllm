# enterprise-default policy (spec §8; ticket-12 schema scope)
id: enterprise-default
version: 7
owner: security-team
effective_date: "2026-10-05"

# RAG context is accepted only with a request- and resource-bound decision.
# The private adapter is selected by deployment configuration; this reviewed
# policy action is fail-closed and cannot redact arbitrary provider shapes.
rag:
  mode: enforce
  on_deny: block
  require_purpose: true
  require_collection: true
  require_classification: false
  allowed_operations: [retrieve, retrieve_result]

default:
  action: allow

evasion:
  enabled: true
  transforms: [nfkc, controls, confusable_skeleton, base64, percent, json_unicode]
  max_decode_depth: 1
  max_decode_work_bytes: 262144
  max_decoded_expansion_ratio: 8
  max_json_depth: 8
  max_json_nodes: 512
  max_json_string_bytes: 16384
  budget_action: block
  actions:
    encoded: block
    cross_part: block
    structured_json: block
    zero_width_control: review
    budget_exceeded: block

# P0.6 compatibility declarations. The v7 sections below are normalized into
# the same effective contract, preserving their stable rule IDs.
safe_default:
  action: block
confidence_escalation:
  - id: high-confidence-secret
    category: SECRET
    min_confidence: 0.90
    action: block
# Provider-boundary baseline for confidential data (precedence level 5).
targets:
  cloud:
    confidential_data: tokenize
  local:
    confidential_data: allow

# Secret protection (precedence level 2). redact = hard mask: the matched
# span is replaced with [REDACTED:SUBTYPE] and the request/response continues;
# the raw value never leaves the gateway and is never recoverable (no vault
# entry). Use action: block to reject the whole request/response instead.
secrets:
  GITLAB_PAT:
    action: block
  GITHUB_TOKEN:
    action: block
  PEM_PRIVATE_KEY:
    action: block
  JWT:
    action: redact
  BEARER_TOKEN:
    action: redact
  AWS_ACCESS_KEY:
    action: redact
  AWS_SECRET_ACCESS_KEY:
    action: block
  OPENAI_API_KEY:
    action: block
  ANTHROPIC_API_KEY:
    action: redact
  SLACK_TOKEN:
    action: redact
  GOOGLE_API_KEY:
    action: redact
  GENERIC_API_KEY:
    action: redact
  CONNECTION_STRING:
    action: redact

# PII transformation policy (precedence level 6; ticket 05 consumes).
pii:
  TH_CITIZEN_ID:
    providers:
      cloud:
        action: tokenize
      local:
        action: allow
  PHONE_NUMBER:
    providers:
      cloud:
        action: tokenize
  EMAIL:
    providers:
      cloud:
        action: tokenize
  CREDIT_CARD:
    providers:
      cloud:
        action: tokenize
  MULTIPLE_PII:
    providers:
      cloud:
        action: tokenize
      local:
        action: review

# Semantic risk policy (precedence level 7; tickets 08-11 consume).
semantic:
  prompt_injection:
    high:
      action: block
    medium:
      action: restrict_tools
  system_prompt_extraction:
    high:
      action: block
  credential_exfiltration:
    high:
      action: block
  unsafe_tool_intent:
    high:
      action: restrict_tools
  policy_bypass_intent:
    medium:
      action: restrict_tools

# Tool definitions RESTRICT_TOOLS strips from requests (T-025).
tools:
  restricted:
    - shell
    - file_write

fallback:
  laya_unavailable:
    high_risk: block
    low_risk: deterministic_only
  # P0.5 semantic evidence failures are explicit policy decisions. High-risk
  # unknown/error paths remain BLOCK in the strict profile.
  semantic:
    - risk: high
      direction: "*"
      provider: "*"
      on_error: block
    - risk: medium
      direction: "*"
      provider: "*"
      on_error: review
    - risk: low
      direction: "*"
      provider: "*"
      on_error: review
