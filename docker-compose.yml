services:
  security-gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      LISTEN_ADDR: ":8080"
      UPSTREAM_BASE_URL: "http://mock-upstream:9090"
      UPSTREAM_AUTH_MODE: "none"
      SECURITY_MODE: "off"
      LOG_LEVEL: "info"
    depends_on:
      - mock-upstream

  mock-upstream:
    build:
      context: .
      dockerfile: Dockerfile.mock-upstream
    ports:
      - "9090:9090"
